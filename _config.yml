title: Tianyuan (Tiana) Wang
description: >-
  Applied economist at the University of Georgia. Research on food prices and
  policy, with projects in data science.
url: https://tianawangty.github.io

plugins:
  - jekyll-redirect-from

# The plugin writes a redirects.json manifest by default; the site does not need it.
redirect_from:
  json: false

exclude:
  - quality_reports
  - README.md
  - LICENSE.txt
  - elements.html
  - generic.html
  - SESSION_REPORT.md
  - Gemfile
  - Gemfile.lock
  - vendor
